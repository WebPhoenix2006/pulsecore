<div class="analytics-page">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">
        <i class="fas fa-chart-line"></i>
        Sales Analytics
      </h1>
      <p class="page-subtitle">Detailed sales performance metrics</p>
    </div>
    <div class="header-actions">
      <div class="date-filters">
        <input
          type="date"
          [(ngModel)]="dateRange.start_date"
          (change)="onDateRangeChange()"
          class="date-input"
          placeholder="Start Date"
        />
        <span class="date-separator">to</span>
        <input
          type="date"
          [(ngModel)]="dateRange.end_date"
          (change)="onDateRangeChange()"
          class="date-input"
          placeholder="End Date"
        />
      </div>
      <button (click)="exportData()" class="export-btn">
        <i class="fas fa-download"></i>
        Export CSV
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading sales data...</p>
  </div>

  <div *ngIf="error && !loading" class="error-state">
    <i class="fas fa-exclamation-circle"></i>
    <p>{{ error }}</p>
    <button (click)="loadSales()" class="retry-btn">Retry</button>
  </div>

  <div *ngIf="!loading && !error" class="content-card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Total Orders</th>
            <th>Items Sold</th>
            <th>Revenue</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sale of salesData">
            <td class="date-cell">
              <i class="fas fa-calendar"></i>
              {{ sale.date | date : 'MMM dd, yyyy' }}
            </td>
            <td class="orders-cell">{{ sale.total_orders }}</td>
            <td class="items-cell">{{ sale.total_items }}</td>
            <td class="revenue-cell">${{ sale.total_revenue }}</td>
          </tr>
          <tr *ngIf="salesData.length === 0">
            <td colspan="4" class="empty-state">
              <i class="fas fa-inbox"></i>
              <p>No sales data available for the selected period</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
